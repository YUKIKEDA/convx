[package]
name = "convx"
version = "0.1.1"
edition = "2021"
rust-version = "1.89"
description = "N-dimensional convex hull, Delaunay triangulation, and Voronoi diagram with exact predicates"
repository = "https://github.com/YUKIKEDA/convx"
homepage = "https://github.com/YUKIKEDA/convx"
documentation = "https://docs.rs/convx"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["convex-hull", "delaunay", "voronoi", "geometry", "exact"]
categories = ["algorithms", "mathematics", "science"]
# A whitelist (`.cursor/rules/publish.mdc`). A root file starts with `/`:
# without it the pattern also matches a file of that name in a directory.
include = [
    "src/**/*",
    "examples/**/*",
    "tests/**/*",
    # A unit test and the example that exports the sets read this list.
    "/benches/sets.txt",
    "/README.md",
    "/README.ja.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"

[dependencies]
faer = { version = "0.24", default-features = false, features = ["std"] }
pulp = { version = "0.22", features = ["x86-v4"] }
thiserror = "2"

[dev-dependencies]
# Counts the allocations of a build in `tests/alloc.rs` (#521).
stats_alloc = "0.1.10"
# The fixture test runs its records on rayon's pool; the library has no
# parallel path (design §6).
rayon = "1"

# Its own program: the harness's thread allocates beside the counted build
# (#575).
[[test]]
name = "alloc"
harness = false
