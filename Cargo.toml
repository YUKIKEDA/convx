[package]
name = "convx"
version = "0.0.0"
edition = "2021"
rust-version = "1.89"
description = "N-dimensional convex hull, Delaunay triangulation, and Voronoi diagram with exact predicates"
repository = "https://github.com/YUKIKEDA/convx"
publish = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"

[dependencies]
faer = { version = "0.24", default-features = false, features = ["std"] }
pulp = { version = "0.22", features = ["x86-v4"] }
rayon = "1"
thiserror = "2"
