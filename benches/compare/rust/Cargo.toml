# The Rust adapters of the comparison (benches/compare/README.md). A package
# of its own: its dependencies are not convx's, and nothing of it ships.
[package]
name = "convx-compare"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
convx = { path = "../../.." }

[profile.release]
debug = true
