# The Rust adapters of the comparison (benches/compare/README.md). A package
# of its own: its dependencies are not convx's, and nothing of it ships.
[package]
name = "convx-compare"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
convx = { path = "../../.." }
delaunator = "1.1.0"
delaunay = "0.8.2"
geo = "0.33.1"
parry3d-f64 = "0.31.1"
spade = "2.15.1"

[profile.release]
debug = true
