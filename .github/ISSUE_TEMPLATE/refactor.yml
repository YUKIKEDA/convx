name: Refactor
description: Internal restructuring with no change callers can see
title: "[refactor] "
labels: ["type:refactor"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What becomes easier to maintain. English. Ease of the edit is not the reason.
    validations:
      required: true
  - type: input
    id: roadmap
    attributes:
      label: Roadmap ID
      description: Example - P2
      placeholder: P2
    validations:
      required: true
  - type: input
    id: design
    attributes:
      label: Design section
      placeholder: "docs/design.ja.md §6"
  - type: textarea
    id: depends
    attributes:
      label: Depends on
      placeholder: "#12"
  - type: textarea
    id: dod
    attributes:
      label: Definition of done
      description: Checkable outcomes. Caller-visible behavior stays the same.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Optional. Work left outside this Issue, and the roadmap row that names when.
